name: Octordle
options:
  bundleIdPrefix: com.ikuhei
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "1.06"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "Q98K2GW9ZQ"
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_FILE: Octordle/Info.plist

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    version: 11.2.0
  firebase-ios-sdk:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: 11.0.0
  clarity-apps:
    url: https://github.com/microsoft/clarity-apps
    branch: main
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    version: 2.7.0

targets:
  Octordle:
    type: application
    platform: iOS
    sources:
      - path: Octordle
        excludes:
          - "**/.DS_Store"
    resources:
      - path: Octordle/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ikuhei.octordle
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Octordle"
        INFOPLIST_KEY_NSUserTrackingUsageDescription: "Allowing tracking helps us keep Octordle free. It simply makes ads more relevant to you — it won't increase the number of ads you see."
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.word-games"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: GoogleMobileAds
        product: GoogleMobileAds
      - package: firebase-ios-sdk
        product: FirebaseAnalytics
      - package: clarity-apps
        product: Clarity
      - package: GoogleUserMessagingPlatform
        product: GoogleUserMessagingPlatform

schemes:
  Octordle:
    build:
      targets:
        Octordle: all
    run:
      config: Debug
      storeKitConfiguration: Octordle/Products.storekit
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
