<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>variant paper hero · single</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,800;1,700&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--ink:#261F1C;--ink2:#5E564A;--accent:#AE4124;--rule:rgba(38,31,28,.35);
        --serif:'Playfair Display',Georgia,'Times New Roman',serif;--sans:'Inter',-apple-system,'Helvetica Neue',sans-serif;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#111;font-family:var(--sans);padding:40px}
  .gallery{display:flex;gap:28px;width:max-content}
  .shot{width:430px;height:932px;flex:none;position:relative;overflow:hidden;border-radius:28px;background:radial-gradient(circle 420px at 50% -60px, rgba(174,65,36,.16), transparent 70%),linear-gradient(180deg,#EDE5D2 0%,#E4DAC3 100%)}
  .rules{position:absolute;left:0;right:0;top:28px;z-index:2;pointer-events:none}
  .rules i{display:block;height:1px;background:var(--rule);margin:0 26.4px} .rules i+i{margin-top:3px;opacity:.6}
  .kicker{position:relative;z-index:30;text-align:center;padding-top:44px;font:600 12px/1 var(--sans);letter-spacing:2.64px;text-transform:uppercase;color:var(--ink2)}
  .caption{position:relative;z-index:30;text-align:center;padding:44px 17.6px 0}
  .caption h1{font:800 53px/1.08 var(--serif);letter-spacing:-.6px;color:var(--ink)}
  .caption h1 a{color:var(--accent);font-style:italic;text-decoration:none}
  .caption h2{margin-top:13.200000000000001px;font:600 24px/1.32 var(--sans);letter-spacing:-.2px;color:var(--ink2)}
  .device{position:absolute;left:50%;top:262px;transform:translateX(-50%);width:338px;z-index:10;border-radius:46px;overflow:hidden;
           background:#000;border:1.5px solid rgba(38,31,28,.55);box-shadow:0 34px 70px rgba(38,31,28,.35),0 0 0 1px rgba(0,0,0,.25)}
  .device.tilt{transform:translateX(-50%) rotate(-3deg)} .device.tilt2{transform:translateX(-50%) rotate(2.5deg)}
  .device img{display:block;width:100%;height:auto}
  .device.card{width:358px;top:306px;border-radius:74px}
  .duo .device{width:250px;top:286px}
  .duo .device.l{left:31%;transform:translateX(-50%) rotate(-5deg)} .duo .device.r{left:69%;transform:translateX(-50%) rotate(5deg);z-index:11}
  .duo .stamp.l{top:244px;z-index:26} .duo .stamp.r{top:252px;z-index:26}
  .stamp{position:absolute;z-index:25;font:700 12.5px/1 var(--serif);letter-spacing:1.25px;text-transform:uppercase;white-space:nowrap;
          padding:8.75px 13.750000000000002px;color:#AE4124;background:rgba(244,240,230,.9);border:2px solid #AE4124;
          box-shadow:0 8px 20px rgba(0,0,0,.18)}
  .stamp:before{content:"";position:absolute;inset:3px;border:1px solid #AE4124;opacity:.55}
  .stamp.l{left:19.8px;top:248px} .stamp.r{right:19.8px;top:268px}
</style></head>
<body><div class="gallery">
  <div class="shot">
    <div class="caption"><h1>Eight Words.<br><a>One Edition.</a></h1><h2>Solve 8 words at once, every day</h2></div>
    <div class="device tilt"><img src="../shots/iphone_game_light.png" alt=""></div><span class="stamp l" data-decor style="transform:rotate(-7deg)">No. 118</span><span class="stamp r" data-decor style="transform:rotate(5deg)">8 boards · 13 guesses</span>
  </div>
</div></body></html>
